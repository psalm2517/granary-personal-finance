name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Build
        run: flutter build linux --release --no-tree-shake-icons

      - name: Package
        run: |
          cd build/linux/x64/release
          tar czf clearly-linux-x64-${{ github.ref_name }}.tar.gz bundle/

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: build/linux/x64/release/clearly-linux-x64-${{ github.ref_name }}.tar.gz
          # No generate_release_notes here on purpose — release notes are
          # drafted by hand and the release is normally already created
          # (via `gh release create`) by the time this runs. This step's
          # job is just attaching the binary, never touching the body.
          fail_on_unmatched_files: true
